<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map of Russia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f0f23;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .card {
            background: #1a1a3e;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
            max-width: 1100px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #ff6b6b;
            font-size: 36px;
            margin-bottom: 8px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .subtitle {
            color: #8892b0;
            font-size: 14px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .map-container {
            background: #0d1b2a;
            border-radius: 16px;
            padding: 20px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .russia-main {
            fill: #e94560;
            stroke: #ff6b6b;
            stroke-width: 2;
            opacity: 0.95;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .russia-main:hover {
            fill: #ff6b6b;
            stroke: #ffd93d;
            stroke-width: 3;
            filter: drop-shadow(0 0 10px rgba(255,107,107,0.5));
        }
        .kaliningrad {
            fill: #e94560;
            stroke: #ff6b6b;
            stroke-width: 1.5;
            opacity: 0.95;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .kaliningrad:hover {
            fill: #ff6b6b;
            stroke: #ffd93d;
            stroke-width: 2.5;
            filter: drop-shadow(0 0 8px rgba(255,107,107,0.5));
        }
        .water {
            fill: #0d1b2a;
        }
        .label-main {
            fill: #fff;
            font-size: 16px;
            font-weight: 700;
            text-anchor: middle;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .label-kaliningrad {
            fill: #ffd93d;
            font-size: 10px;
            font-weight: 600;
            text-anchor: middle;
            pointer-events: none;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8892b0;
            font-size: 13px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 2px solid #ff6b6b;
        }
        .legend-color.main { background: #e94560; }
        .legend-color.exclave { background: #e94560; width: 12px; height: 12px; }
        .footer {
            margin-top: 25px;
            color: #5a6680;
            font-size: 12px;
        }
        @media (max-width: 600px) {
            .card { padding: 20px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Russia</h1>
        <div class="subtitle">SVG Map Visualization</div>

        <div class="map-container">
            <svg viewBox="-20 -20 1040 400" xmlns="http://www.w3.org/2000/svg">
                <rect x="-20" y="-20" width="1040" height="400" class="water" rx="12" />

                <path class="russia-main" d="M 60 175
                    l 18 -83
                    l 44 -4
                    l -22 50
                    l 78 -46
                    l 104 -40
                    l 23 26
                    l 167 -74
                    l 43 38
                    l 90 4
                    l 135 18
                    l 122 10
                    l 130 42
                    l -76 26
                    l -94 34
                    l -30 90
                    l -10 -60
                    l -30 -24
                    l -84 94
                    l -16 70
                    l -8 7
                    l 18 -57
                    l -150 -40
                    l -104 20
                    l -116 -50
                    l -86 40
                    l -40 40
                    l -26 40
                    l -24 0
                    l -26 -23
                    l -28 -10
                    l -34 -37
                    l -16 -50
                    l 48 -51
                    z" />

                <path class="kaliningrad" d="M 6 228
                    l 9 0
                    l 0 8
                    l -9 0
                    z" />

                <text x="500" y="150" class="label-main">Russia</text>
                <text x="10" y="248" class="label-kaliningrad">Kaliningrad</text>
            </svg>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color main"></div>
                <span>Russian Federation</span>
            </div>
            <div class="legend-item">
                <div class="legend-color exclave"></div>
                <span>Kaliningrad Oblast (Exclave)</span>
            </div>
        </div>

        <div class="footer">Generated from Brainfuck + SVG path data</div>
    </div>
</body>
</html>
